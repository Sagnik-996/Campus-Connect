<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | CampusConnect</title>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts & Style -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Navigation Bar -->
  <header class="navbar">
    <a href="index.html" class="logo">
      <i class="fa-solid fa-graduation-cap"></i>
      <span>CampusConnect</span>
    </a>
    <div class="nav-buttons">
      <button class="theme-toggle" id="theme-toggle" title="Toggle Theme">
        <i class="fa-solid fa-sun"></i>
      </button>
      <a href="index.html" class="btn btn-secondary"><i class="fa-solid fa-home"></i> Home</a>
    </div>
  </header>

  <!-- Login Form Card -->
  <main class="container" style="display:flex; justify-content:center; align-items:center;">
    <div class="glass form-box">
      <div class="form-header">
        <h2>Welcome Back</h2>
        <p>Login to book your college events</p>
      </div>
      <form id="login-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="login-email">Email Address</label>
          <input type="email" id="login-email" class="form-control" placeholder="name@college.edu" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="login-password">Password</label>
          <input type="password" id="login-password" class="form-control" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%; margin-top:10px;">
          Login <i class="fa-solid fa-arrow-right-to-bracket"></i>
        </button>
      </form>
      <div class="form-footer">
        Don't have an account? <a href="register.html">Register</a>
        <br><br>
        Are you an administrator? <a href="admin-login.html">Admin Login</a>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer>
    <div class="container" style="margin:0 auto; padding:0;">
      <p>&copy; 2026 CampusConnect. All rights reserved.</p>
    </div>
  </footer>

  <!-- Script -->
  <script src="js/script.js" defer></script>
</body>
</html>
