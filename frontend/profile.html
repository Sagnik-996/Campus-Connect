<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile | CampusConnect</title>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts & Style -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Navigation Bar -->
  <header class="navbar">
    <a href="index.html" class="logo">
      <i class="fa-solid fa-graduation-cap"></i>
      <span>CampusConnect</span>
    </a>
    <button class="burger" id="menu-toggle">
      <span></span>
      <span></span>
      <span></span>
    </button>
    <ul class="nav-links" id="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="events.html">Events</a></li>
      <li><a href="my-bookings.html">My Bookings</a></li>
      <li><a href="profile.html" class="active">Profile</a></li>
      <li class="admin-link" style="display:none;"><a href="admin-dashboard.html">Admin Panel</a></li>
    </ul>
    <div class="nav-buttons">
      <button class="theme-toggle" id="theme-toggle" title="Toggle Theme">
        <i class="fa-solid fa-sun"></i>
      </button>
      <div id="user-profile-menu" style="display:flex; align-items:center; gap:15px;">
        <span id="nav-username" style="font-weight:600; font-size:0.9rem;"></span>
        <button id="logout-btn" class="btn btn-secondary" style="padding: 6px 12px; font-size: 0.8rem;">Logout</button>
      </div>
    </div>
  </header>

  <!-- Profile Settings Main Content -->
  <main class="container">
    <div style="margin-bottom:30px;">
      <h1 style="font-size:2.2rem; margin-bottom:10px;">User Settings</h1>
      <p style="color:var(--text-secondary);">Manage your profile credentials and account statistics.</p>
    </div>

    <div style="display:grid; grid-template-columns: 1fr 2fr; gap:30px; align-items:start;">
      
      <!-- Stats Summary Card -->
      <div class="glass" style="padding:30px; text-align:center; display:flex; flex-direction:column; gap:20px;">
        <div style="width:90px; height:90px; border-radius:50%; background:linear-gradient(135deg, var(--accent), var(--purple)); color:white; display:flex; align-items:center; justify-content:center; font-size:2.5rem; margin: 0 auto;">
          <i class="fa-solid fa-user"></i>
        </div>
        <div>
          <h2 id="profile-card-name" style="font-size:1.4rem;">Student Name</h2>
          <p id="profile-card-email" style="font-size:0.85rem; color:var(--text-secondary); margin-top:2px;">student@college.edu</p>
        </div>
        
        <hr style="border:none; border-top:1px solid var(--glass-border);">

        <div style="display:grid; grid-template-columns:1fr; gap:15px; text-align:left;">
          <div style="display:flex; justify-content:space-between; font-size:0.9rem;">
            <span style="color:var(--text-secondary);"><i class="fa-solid fa-ticket" style="margin-right:6px; color:var(--accent);"></i> Tickets Booked</span>
            <strong id="profile-stat-bookings">0</strong>
          </div>
          <div style="display:flex; justify-content:space-between; font-size:0.9rem;">
            <span style="color:var(--text-secondary);"><i class="fa-solid fa-chair" style="margin-right:6px; color:var(--success);"></i> Seats Reserved</span>
            <strong id="profile-stat-seats">0</strong>
          </div>
        </div>
      </div>

      <!-- Settings Edit Form -->
      <div class="glass" style="padding:40px;">
        <h2 style="font-size:1.5rem; margin-bottom:20px; border-bottom:1px solid var(--glass-border); padding-bottom:10px;">Update Credentials</h2>
        <form id="profile-update-form">
          <div class="form-group">
            <label class="form-label" for="profile-name">Full Name</label>
            <input type="text" id="profile-name" class="form-control" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="profile-email">Email Address</label>
            <input type="email" id="profile-email" class="form-control" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="profile-new-password">New Password (leave blank to keep current)</label>
            <input type="password" id="profile-new-password" class="form-control" placeholder="Enter new password">
          </div>
          <button type="submit" class="btn btn-primary" style="margin-top:10px;">
            Save Settings <i class="fa-solid fa-floppy-disk"></i>
          </button>
        </form>
      </div>

    </div>
  </main>

  <!-- Footer -->
  <footer>
    <div class="container" style="margin:0 auto; padding:0;">
      <p>&copy; 2026 CampusConnect. All rights reserved.</p>
    </div>
  </footer>

  <!-- Script -->
  <script src="js/script.js" defer></script>
</body>
</html>
